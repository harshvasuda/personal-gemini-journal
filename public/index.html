<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal AI Journal</title>
    <!-- Professional Google AI Sparkle Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z'/></svg>">
    
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase App & Auth SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e5edff 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            color: var(--text-main);
        }

        .journal-card {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .auth-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .auth-btn {
            background-color: var(--primary);
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .auth-btn:hover {
            background-color: var(--primary-hover);
        }

        .user-info {
            display: none;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .logout-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: underline;
        }

        .header {
            margin-bottom: 1.75rem;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #e0e7ff;
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            margin-bottom: 0.75rem;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--accent);
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        textarea:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        textarea::placeholder {
            color: #94a3b8;
        }

        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: var(--primary);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.875rem 1.5rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 12px -2px rgba(79, 70, 229, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .response-container {
            margin-top: 2rem;
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
            display: none;
        }

        .prompt-box {
            margin-bottom: 1.25rem;
        }

        .response-header {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .prompt-content {
            background-color: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.875rem 1rem;
            color: #334155;
            font-size: 0.9rem;
            line-height: 1.5;
            font-style: italic;
        }

        .response-content {
            background-color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
            animation: fadeIn 0.3s ease-in-out;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .journal-card {
                padding: 1.5rem;
                border-radius: 16px;
            }
            .header h1 {
                font-size: 1.35rem;
            }
            .header p {
                font-size: 0.875rem;
            }
            textarea {
                min-height: 130px;
                font-size: 0.95rem;
            }
            .btn-submit {
                font-size: 0.95rem;
                padding: 0.75rem 1.25rem;
            }
        }
    </style>
</head>
<body>

    <div class="journal-card">
        <div class="auth-bar">
            <span class="badge" style="margin-bottom:0;">Authenticated Vault</span>
            <div id="authSection">
                <button id="loginBtn" class="auth-btn" onclick="signIn()">Sign in with Google</button>
                <div id="userInfo" class="user-info">
                    <span id="userEmail"></span>
                    <button class="logout-btn" onclick="signOut()">Sign Out</button>
                </div>
            </div>
        </div>

        <div class="header">
            <span class="badge">AI-Powered</span>
            <h1>Daily Reflection Journal</h1>
            <p>Write your thoughts, reflections, or moments from today. Gemini will analyze and summarize your entry with empathy and insights.</p>
        </div>

        <div class="form-group">
            <textarea id="journalInput" placeholder="What is on your mind today? Write freely..."></textarea>
            <button class="btn-submit" id="submitBtn" onclick="submitJournal()">
                <div class="spinner" id="spinner"></div>
                <span id="btnText">Analyze & Save</span>
            </button>
        </div>

        <div class="response-container" id="responseContainer">
            <!-- User Prompt Box -->
            <div class="prompt-box">
                <div class="response-header">
                    <span>Your Submitted Reflection (Prompt)</span>
                    <span style="font-size: 0.7rem; color: #94a3b8; text-transform: none;">Captured Input</span>
                </div>
                <div class="prompt-content" id="promptDisplay"></div>
            </div>

            <!-- Gemini Response Box -->
            <div class="response-header">
                <span>Gemini AI Reflection & Insights</span>
                <span style="font-size: 0.7rem; color: var(--primary); text-transform: none;">Encrypted in Firestore</span>
            </div>
            <div class="response-content" id="responseOutput"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBRzYlz6j9Viv4PqToBxqGxrygFXjcmybQ",
            authDomain: "personal-gemini-journal-5b10e.firebaseapp.com",
            projectId: "personal-gemini-journal-5b10e",
            storageBucket: "personal-gemini-journal-5b10e.firebasestorage.app",
            messagingSenderId: "119125891280",
            appId: "1:119125891280:web:e4df9025bf74e23d25e6d5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let currentUser = null;

        auth.onAuthStateChanged(user => {
            currentUser = user;
            const loginBtn = document.getElementById('loginBtn');
            const userInfo = document.getElementById('userInfo');
            const userEmail = document.getElementById('userEmail');

            if (user) {
                loginBtn.style.display = 'none';
                userInfo.style.display = 'flex';
                userEmail.innerText = user.displayName || user.email;
            } else {
                loginBtn.style.display = 'block';
                userInfo.style.display = 'none';
            }
        });

        async function signIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
            } catch (error) {
                alert('Sign-in Error: ' + error.message);
            }
        }

        async function signOut() {
            await auth.signOut();
            document.getElementById('responseContainer').style.display = 'none';
        }

        async function submitJournal() {
            if (!currentUser) {
                alert('Please sign in with Google to analyze and save your journal entry.');
                return;
            }

            const input = document.getElementById('journalInput');
            const output = document.getElementById('responseOutput');
            const promptDisplay = document.getElementById('promptDisplay');
            const container = document.getElementById('responseContainer');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');

            const text = input.value.trim();
            if (!text) {
                alert('Please write an entry before submitting.');
                return;
            }

            submitBtn.disabled = true;
            btnText.innerText = 'Analyzing...';
            spinner.style.display = 'block';
            
            // Set prompt text and show container
            promptDisplay.innerText = text;
            container.style.display = 'block';
            output.innerText = 'Reflecting on your entry and saving to secure cloud vault...';

            try {
                const token = await currentUser.getIdToken();
                const response = await fetch('/api/journal', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ content: text })
                });

                const data = await response.json();

                if (response.ok) {
                    output.innerText = data.analysis || JSON.stringify(data);
                    input.value = '';
                } else {
                    output.innerText = 'Error: ' + (data.error || 'Something went wrong while processing.');
                }
            } catch (error) {
                output.innerText = 'Network Error: Unable to reach the server. Please check your connection.';
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                btnText.innerText = 'Analyze & Save';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
