<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal AI Journal</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e5edff 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            color: var(--text-main);
        }

        .journal-card {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .header {
            margin-bottom: 1.75rem;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #e0e7ff;
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            margin-bottom: 0.75rem;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--accent);
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        textarea:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        textarea::placeholder {
            color: #94a3b8;
        }

        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: var(--primary);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.875rem 1.5rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 12px -2px rgba(79, 70, 229, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .response-container {
            margin-top: 2rem;
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
            display: none;
        }

        .response-header {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        .response-content {
            background-color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
            animation: fadeIn 0.3s ease-in-out;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Optimization */
        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .journal-card {
                padding: 1.5rem;
                border-radius: 16px;
            }
            .header h1 {
                font-size: 1.35rem;
            }
            .header p {
                font-size: 0.875rem;
            }
            textarea {
                min-height: 130px;
                font-size: 0.95rem;
            }
            .btn-submit {
                font-size: 0.95rem;
                padding: 0.75rem 1.25rem;
            }
        }
    </style>
</head>
<body>

    <div class="journal-card">
        <div class="header">
            <span class="badge">AI-Powered</span>
            <h1>Daily Reflection Journal</h1>
            <p>Write your thoughts, reflections, or moments from today. Gemini will analyze and summarize your entry with empathy and insights.</p>
        </div>

        <div class="form-group">
            <textarea id="journalInput" placeholder="What is on your mind today? Write freely..."></textarea>
            <button class="btn-submit" id="submitBtn" onclick="submitJournal()">
                <div class="spinner" id="spinner"></div>
                <span id="btnText">Analyze Entry</span>
            </button>
        </div>

        <div class="response-container" id="responseContainer">
            <div class="response-header">AI Reflection & Summary</div>
            <div class="response-content" id="responseOutput"></div>
        </div>
    </div>

    <script>
        async function submitJournal() {
            const input = document.getElementById('journalInput');
            const output = document.getElementById('responseOutput');
            const container = document.getElementById('responseContainer');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');

            const text = input.value.trim();
            if (!text) {
                alert('Please write an entry before submitting.');
                return;
            }

            // Set loading state
            submitBtn.disabled = true;
            btnText.innerText = 'Analyzing...';
            spinner.style.display = 'block';
            container.style.display = 'block';
            output.innerText = 'Reflecting on your entry, please wait a moment...';

            try {
                const response = await fetch('/api/journal', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content: text })
                });

                const data = await response.json();

                if (response.ok) {
                    output.innerText = data.analysis || JSON.stringify(data);
                } else {
                    output.innerText = 'Error: ' + (data.error || 'Something went wrong while processing.');
                }
            } catch (error) {
                output.innerText = 'Network Error: Unable to reach the server. Please check your connection.';
                console.error(error);
            } finally {
                // Reset loading state
                submitBtn.disabled = false;
                btnText.innerText = 'Analyze Entry';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
