<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Gemini Journal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 150px; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; resize: none; font-size: 16px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .response-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 4px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h2>My Personal Gemini Journal 📖</h2>
        <p>Apne aaj ke din ke baare mein likhiye, Gemini isko analyze karega:</p>
        <textarea id="journalInput" placeholder="Yahan apni journal entry likhiye..."></textarea>
        <br>
        <button onclick="submitJournal()">Gemini se Analyze Karayein</button>
        <div class="response-box" id="responseOutput">Aapka response yahan aayega...</div>
    </div>

    <script>
        async function submitJournal() {
            const text = document.getElementById('journalInput').value;
            const outputDiv = document.getElementById('responseOutput');

            if (!text.trim()) {
                alert('Pehle kuch likhiye toh sahi!');
                return;
            }

            outputDiv.innerText = 'Gemini soch raha hai... Kripya pratiksha karein ⏳';

            try {
                // Aapka live Render backend URL
                const response = await fetch('https://personal-gemini-journal-fo14.onrender.com/api/journal', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content: text })
                });

                const data = await response.json();
                if (response.ok) {
                    outputDiv.innerText = data.analysis || JSON.stringify(data);
                } else {
                    outputDiv.innerText = 'Error: ' + (data.error || 'Kuch gadbad ho gayi!');
                }
            } catch (error) {
                outputDiv.innerText = 'Network Error: Server tak baat nahi pahunch pa rahi hai.';
                console.error(error);
            }
        }
    </script>
</body>
</html>
